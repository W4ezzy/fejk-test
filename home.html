<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/main.css?v=5.0">
    <link rel="stylesheet" href="assets/home.css?v=5.2">
    <link rel="icon" type="image/png" href="assets/demo-icon-180.png">
    <link rel="apple-touch-icon" href="assets/demo-icon-180.png">
    <link rel="shortcut icon" href="assets/demo-icon-180.png">
    <meta name="theme-color" content="#111218">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="documents_body">
    <div class="bottom_bar documents_bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home_open home"></div>
                <p class="bottom_element_text open">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <main class="documents_shell">
        <header class="documents_appbar">
            <img src="assets/demo-icon-64.png" class="documents_mark" alt="">
            <button class="documents_bell" type="button" aria-label="Powiadomienia"></button>
        </header>

        <section class="documents_titlebar">
            <h1>Dokumenty</h1>
            <div class="documents_actions">
                <button type="button" class="documents_link" data-action="customize">Dostosuj</button>
                <button type="button" class="documents_link" data-action="add">Dodaj</button>
            </div>
        </section>

        <section class="documents_cards" aria-label="Twoje dokumenty">
            <button class="document_card mdowod_card" type="button" data-route="card">
                <span class="document_card_title">mDowód</span>
                <img class="document_card_logo" src="assets/demo-icon-64.png" alt="">
            </button>
        </section>
    </main>

    <script src="assets/bar.js?v=5.1"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/document-catalog.js?v=1.0"></script>
    <script src="assets/home.js?v=5.1"></script>
</body>
</html>
