<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/main.css?v=5.0">
    <link rel="stylesheet" href="assets/id.css?v=4.1">
    <link rel="icon" type="image/png" href="assets/demo-icon-180.png">
    <link rel="apple-touch-icon" href="assets/demo-icon-180.png">
    <link rel="shortcut icon" href="assets/demo-icon-180.png">
    <meta name="theme-color" content="#111218">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="splash_screen" aria-hidden="true">
        <img class="splash_logo" src="assets/demo-icon-192.png" alt="">
    </div>

    <main class="login_shell">
        <header class="login_brand" aria-label="mObywatel 2.0">
            <img class="app_mark" src="assets/demo-icon-64.png" alt="">
            <span>mObywatel 2.0</span>
        </header>

        <section class="login_intro">
            <div class="key_circle" aria-hidden="true">
                <svg viewBox="0 0 64 64" focusable="false">
                    <path d="M25 38a14 14 0 1 1 9.9 4.1l-5.5 5.5h-5.8v5.8h-6.1v5.1H8v-9.4l15.3-15.3A14 14 0 0 1 25 38Z"/>
                    <circle cx="38" cy="26" r="5.3"/>
                </svg>
            </div>
            <h1>Wpisz aktualne hasło</h1>
            <button type="button" class="biometric_login">Logowanie biometrią</button>
        </section>

        <section class="password_box" aria-label="Logowanie hasłem">
            <div class="password_grid">
                <label class="password_text" for="password_input">Hasło</label>
                <div class="input_holder">
                    <input id="password_input" class="password_input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Wpisz hasło">
                    <button class="eye" type="button" aria-label="Pokaż hasło"></button>
                    <span class="input_spinner" aria-hidden="true"></span>
                </div>
                <button class="forgot_password" type="button">Nie pamiętam hasła</button>
                <p class="pin_status" aria-live="polite"></p>
            </div>
        </section>

        <button type="button" class="login">Zaloguj się</button>
        <p class="version">wersja 4.84.1</p>
    </main>

    <div class="biometric_sheet" aria-hidden="true">
        <div class="biometric_card" role="dialog" aria-modal="true" aria-label="Logowanie biometryczne">
            <img class="biometric_app_icon" src="assets/demo-icon-128.png" alt="">
            <p class="biometric_app_name">mObywatel</p>
            <div class="biometric_symbol" aria-hidden="true"></div>
            <p class="biometric_title">Potwierdź biometrię</p>
            <p class="biometric_hint">Nie zapisujemy żadnych danych biometrycznych.</p>
            <div class="biometric_progress" aria-hidden="true"></div>
            <button type="button" class="biometric_cancel">Anuluj</button>
        </div>
    </div>

    <script src="assets/id.js?v=4.3"></script>
    <script src="assets/manifest.js"></script>
</body>
</html>
