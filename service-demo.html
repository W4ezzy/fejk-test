<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111218">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="assets/main.css?v=5.0">
    <link rel="stylesheet" href="assets/service-demo.css?v=4.3">
    <link rel="icon" type="image/png" href="assets/demo-icon-180.png">
    <link rel="apple-touch-icon" href="assets/demo-icon-180.png">
    <link rel="shortcut icon" href="assets/demo-icon-180.png">
</head>
<body>
    <main class="service_screen">
        <header class="service_header">
            <button class="back_button" type="button" aria-label="Wróć">
                <span aria-hidden="true"></span>
            </button>
            <img class="service_header_logo" src="assets/demo-icon-64.png" alt="">
            <button class="favorite_button" type="button" aria-label="Dodaj do ulubionych">
                <span aria-hidden="true"></span>
            </button>
        </header>

        <section class="service_hero">
            <img class="service_hero_icon" src="services_files/sign_document.png" alt="">
            <p class="service_badge">Usługa</p>
            <h1 class="service_title">Usługa</h1>
            <p class="service_description">Wybierz jedną z opcji, aby kontynuować obsługę sprawy.</p>
        </section>

        <section class="service_card">
            <div class="service_row">
                <span>Status</span>
                <strong>Gotowe do uruchomienia</strong>
            </div>
            <div class="service_row">
                <span>Wymagane</span>
                <strong class="service_requirement">Potwierdzenie tożsamości</strong>
            </div>
            <div class="service_row">
                <span>Czas obsługi</span>
                <strong class="service_time">Kilka minut</strong>
            </div>
        </section>

        <section class="service_details" aria-label="Szczegóły usługi">
            <h2>Co możesz zrobić</h2>
            <ul class="service_points"></ul>
        </section>

        <button class="service_primary" type="button">Uruchom usługę</button>
        <button class="service_secondary" type="button">Więcej informacji</button>
    </main>

    <div class="demo_toast" aria-live="polite" aria-hidden="true">
        <div class="demo_toast_box">
            <strong>Funkcja niedostępna</strong>
            <span>Spróbuj ponownie później.</span>
        </div>
    </div>

    <div class="service_flow" aria-hidden="true">
        <div class="service_flow_panel" role="dialog" aria-modal="true" aria-labelledby="flow_title">
            <button class="flow_close" type="button" aria-label="Zamknij"></button>
            <img class="flow_icon" src="services_files/sign_document.png" alt="">
            <h2 id="flow_title" class="flow_title">Przygotowanie usługi</h2>
            <p class="flow_message">Sprawdzamy wymagane dane.</p>
            <div class="flow_progress" aria-hidden="true">
                <span class="is-active"></span>
                <span></span>
                <span></span>
            </div>
            <button class="flow_done" type="button">OK</button>
        </div>
    </div>

    <script src="assets/bar.js?v=5.1"></script>
    <script src="assets/service-demo.js?v=4.3"></script>
    <script src="assets/manifest.js"></script>
</body>
</html>
